name: CI
on: [push, pull_request]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build-and-test:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        # v4, pinned to a commit so a moved tag can't change what runs here
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Toolchain
        run: sw_vers && swiftc --version
      - name: Build the app bundle (icon, orb, Info.plist, ad hoc signature)
        run: OTTO_APP="$RUNNER_TEMP/Otto.app" OTTO_NO_LAUNCH=1 OTTO_ADHOC=1 ./build.sh
      - name: Check the bundle
        run: |
          test -x "$RUNNER_TEMP/Otto.app/Contents/MacOS/Otto"
          test -f "$RUNNER_TEMP/Otto.app/Contents/Resources/AppIcon.icns"
          test -f "$RUNNER_TEMP/Otto.app/Contents/Resources/orbs.js"
          plutil -lint "$RUNNER_TEMP/Otto.app/Contents/Info.plist"
          codesign --verify --deep "$RUNNER_TEMP/Otto.app"
          "$RUNNER_TEMP/Otto.app/Contents/MacOS/Otto" help
      - name: Tests (no microphone needed)
        run: tests/run.sh
      - name: Installer syntax
        run: bash -n build.sh
      - name: Package the app
        # ditto keeps the bundle intact (the executable bit, the signature); a plain upload would lose them
        run: |
          ZIP="$RUNNER_TEMP/Otto-${GITHUB_SHA::7}.zip"
          ditto -c -k --keepParent "$RUNNER_TEMP/Otto.app" "$ZIP"
          echo "ZIP=$ZIP" >> "$GITHUB_ENV"
      - name: Upload the app
        # v4.6.2, pinned to a commit
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Otto-app
          path: ${{ env.ZIP }}
          retention-days: 30
          if-no-files-found: error

  # Every passing build of main becomes the "latest build" release, so this link always gives the newest app:
  # https://github.com/jimjja/hey-otto/releases/latest/download/Otto.zip
  publish:
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write   # only this job may write, and only to make the release
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Download the app built above
        # v4.3.0, pinned to a commit
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: Otto-app
          path: dist
      - name: Replace the latest-build release
        run: |
          mv dist/Otto-*.zip dist/Otto.zip
          gh release delete latest-build --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes || true
          gh release create latest-build dist/Otto.zip --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --latest \
            --title "Otto, latest build" \
            --notes "Built automatically from $GITHUB_SHA on main. Not notarized by Apple: after unzipping, run \`xattr -dr com.apple.quarantine Otto.app\` and move it to ~/Applications. Building from source is recommended; see the README."

